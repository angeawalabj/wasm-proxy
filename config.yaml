listen_addr: "127.0.0.1:8080"

# Optionnels, valeurs par defaut indiquees ici explicitement
request_timeout_ms: 5000
max_body_bytes: 10485760  # 10 Mio

routes:
  - path_prefix: "/api"
    backend: "http://127.0.0.1:9001"
  - path_prefix: "/"
    backend: "http://127.0.0.1:9002"

plugins:
  - "admin_guard.wasm"
  - "error_masker.wasm"
